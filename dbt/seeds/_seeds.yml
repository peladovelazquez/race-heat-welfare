version: 2

seeds:
  - name: seed_tracks
    description: >
      NSW thoroughbred tracks found in the Betfair data, with approximate
      coordinates used to download weather. Curated by hand.
    columns:
      - name: betfair_track_name
        description: Track name exactly as written by Betfair (join key).
        data_tests:
          - unique
          - not_null
      - name: latitude
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: longitude
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: region
        description: >
          Coastal (roughly within 60 km of the coast, including the Sydney
          basin) or Inland. Approximate, curated by hand.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Coastal", "Inland"]
      - name: racing_class
        description: Racing NSW club class (Metropolitan, Provincial or Country).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Metropolitan", "Provincial", "Country"]
