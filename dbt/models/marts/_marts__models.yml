version: 2

models:
  - name: fct_race_conditions
    description: >
      One row per NSW race with weather at start time, meeting-day maximums,
      heat-risk level (Racing NSW Hot Weather Policy thresholds), track
      region/class and market favourite outcome.
    columns:
      - name: race_id
        data_tests:
          - unique
          - not_null
      - name: region
        data_tests:
          - not_null
      - name: season
        data_tests:
          - accepted_values:
              arguments:
                values: ["Summer", "Autumn", "Winter", "Spring"]
      - name: heat_risk_level
        description: >
          Based on meeting-day max temperature and WBGT in the shade at start.
          High = both policy thresholds met; Elevated = one met; None = neither.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["High", "Elevated", "None"]
      - name: wbgt_shade_estimated_c
        description: Estimated WBGT in the shade at start. Used for heat_risk_level.
      - name: wbgt_sun_estimated_c
        description: Estimated WBGT in the sun at start (BOM). Worst case, reference only.
      - name: is_above_wbgt_sun_threshold
        description: Sensitivity flag - the policy WBGT threshold applied to the sun estimate.
      - name: favourite_won
        description: >
          True if the market favourite won (a dead heat for first counts as a win).
