version: 2

models:
  - name: fct_race_conditions
    description: >
      One row per NSW race with weather at start time, meeting-day maximums,
      Racing NSW heat-policy level (Level 1 / Level 2), track region/class and
      market favourite outcome.
    columns:
      - name: race_id
        data_tests:
          - unique
          - not_null
      - name: region
        data_tests:
          - not_null
      - name: season
        data_tests:
          - accepted_values:
              arguments:
                values: ["Summer", "Autumn", "Winter", "Spring"]
      - name: heat_policy_level
        description: >
          Racing NSW Hot Weather Policy level implied by our data.
          Level 2 = max temperature >= 38C or WBGT shade >= 28C;
          Level 1 = max temperature >= 35C or WBGT shade >= 26C; None otherwise.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["None", "Level 1", "Level 2"]
      - name: heat_policy_level_rank
        description: 0 = None, 1 = Level 1, 2 = Level 2 (for sorting).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
      - name: wbgt_shade_estimated_c
        description: Estimated WBGT in the shade at start. Used for heat_policy_level.
      - name: wbgt_sun_estimated_c
        description: Estimated WBGT in the sun at start (BOM). Worst case, reference only.
      - name: is_level1_wbgt_sun
        description: Sensitivity flag - the Level 1 WBGT threshold applied to the sun estimate.
      - name: favourite_won
        description: >
          True if the market favourite won (a dead heat for first counts as a win).

  - name: fct_heat_event_validation
    description: >
      One row per hand-collected heat event (seed_hot_weather_events) with the
      track's maximum temperature and WBGT (shade) that day, the policy level
      implied by our data and whether the meeting appears in Betfair.
      Case-study validation, not a recall metric (the event list is incomplete).
    columns:
      - name: model_policy_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Below thresholds", "Level 1", "Level 2"]
      - name: day_max_temperature_c
        data_tests:
          - not_null
