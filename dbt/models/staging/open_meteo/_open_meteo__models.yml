version: 2

models:
  - name: stg_open_meteo__weather_hourly
    description: Typed hourly weather per track, in UTC and Sydney local time.
    columns:
      - name: weather_hour_id
        description: Surrogate key (track + UTC hour).
        data_tests:
          - unique
          - not_null
      - name: betfair_track_name
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_tracks')
                field: betfair_track_name
      - name: observed_at_utc
        data_tests:
          - not_null
      - name: temperature_c
        data_tests:
          - not_null
      - name: relative_humidity_pct
        data_tests:
          - not_null
