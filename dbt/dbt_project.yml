# =============================================================================
# race-heat-welfare - dbt project
# Transforms RAW (as-received data) into STAGING (cleaned, typed),
# INTERMEDIATE (business logic building blocks) and MARTS (analysis-ready
# models). Infrastructure is managed by DCM (snowflake/dcm/).
# =============================================================================
name: race_heat_welfare
version: "1.0.0"
config-version: 2
profile: race_heat_welfare

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Racing NSW "Racing in Hot Weather" policy: heat stress is most likely when
  # the ambient temperature is 35C or above, or the WBGT (shade) is 26C or above.
  heat_policy_max_temperature_c: 35
  heat_policy_wbgt_c: 26

models:
  race_heat_welfare:
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: INTERMEDIATE
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table

seeds:
  race_heat_welfare:
    +schema: STAGING
    seed_tracks:
      +column_types:
        latitude: float
        longitude: float
